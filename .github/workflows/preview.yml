name: Preview

on:
  workflow_dispatch:
    inputs:
      include_marker:
        description: Include the lane marker. Use only after separate operator approval.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Require marker secret when requested
        if: ${{ inputs.include_marker }}
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
        run: |
          if [ -z "$LANE_MARKER" ]; then
            echo "include_marker is enabled, but the LANE_MARKER repository secret is missing." >&2
            exit 1
          fi

      - name: Render digest page
        env:
          LANE_MARKER: ${{ inputs.include_marker && secrets.LANE_MARKER || '' }}
          PORT: 8787
        run: |
          output_dir="$RUNNER_TEMP/pages"
          log_file="$RUNNER_TEMP/rig.log"
          mkdir -p "$output_dir"

          node --import tsx --env-file-if-exists=.env src/server.ts >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          deadline=$((SECONDS + 30))
          until curl --silent --show-error --fail --connect-timeout 2 --max-time 5 \
            http://127.0.0.1:8787/digest/2026-10-28 \
            --output "$output_dir/index.html"; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file" >&2
              exit 1
            fi
            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for the digest page." >&2
              cat "$log_file" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: render
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
